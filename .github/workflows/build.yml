name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test --configuration Release

      - name: Publish
        shell: pwsh
        run: |
          $common = '-c', 'Release', '--self-contained', '-p:PublishSingleFile=true', '-p:IncludeNativeLibrariesForSelfExtract=true', '-p:EnableCompressionInSingleFile=true', '-p:DebugType=none'
          foreach ($rid in 'win-x64', 'win-arm64') {
            dotnet publish src/OnedriveBackuper.App -r $rid @common -o "publish/$rid"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            dotnet publish src/OnedriveBackuper.Cli -r $rid @common -o "publish/$rid"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          Get-ChildItem publish -Recurse | Format-Table FullName, Length

      # Opens every screen of the app with example data and saves pictures of it, in light and dark mode.
      # Also catches any screen that fails to load.
      - name: Screenshots
        shell: pwsh
        run: |
          $out = Join-Path $PWD 'screenshots'
          $app = Start-Process publish/win-x64/OnedriveBackuper.exe -ArgumentList '--screenshots', $out -Wait -PassThru
          if (Test-Path "$out/error.txt") { Get-Content "$out/error.txt" }
          if ($app.ExitCode -ne 0) { throw "Screenshot mode failed (exit code $($app.ExitCode))" }
          Get-ChildItem $out | Format-Table Name, Length

      - uses: actions/upload-artifact@v7
        with:
          name: OnedriveBackuper-win-x64
          path: publish/win-x64/*.exe

      - uses: actions/upload-artifact@v7
        with:
          name: OnedriveBackuper-win-arm64
          path: publish/win-arm64/*.exe

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots
          path: screenshots/
